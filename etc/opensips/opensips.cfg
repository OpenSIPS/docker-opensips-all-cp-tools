####### Routing Logic ########

route {
    
    # Sanity checks
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # Handle sequential requests
    if (has_totag()) {
        if (loose_route()) {
            # Handle NAT for in-dialog requests
            if (check_route_param("nat=yes")) {
                setbflag("NAT");
            }
            
            if (is_method("BYE")) {
                # Clean up RTPengine session
                rtpengine_delete();
                do_accounting("log","failed");
            }
            
            route(relay);
            exit;
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                }
            }
            send_reply(404, "Not here");
            exit;
        }
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # Create transaction for new requests
    t_check_trans();

    # Routing logic for non-REGISTER requests
    if (!is_method("REGISTER")) {
        if (is_myself($fd)) {
            # Request from local domain
        } else {
            if (!is_myself($rd)) {
                send_reply(403, "Relay Forbidden");
                exit;
            }
        }
    }

    # Preloaded route checking
    if (loose_route()) {
        xlog("L_ERR", "Attempt to route with preloaded Route's [$fu/$tu/$ru/$ci]");
        if (!is_method("ACK"))
            send_reply(403,"Preload Route denied");
        exit;
    }

    # Record-Route for dialog-creating methods
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle accounting
    if (is_method("INVITE")) {
        do_accounting("log");
    }

    # Handle requests not for local domain
    if (!is_myself($rd)) {
        append_hf("P-hint: outbound\r\n");
        route(relay);
        exit;
    }

    # Reject PUBLISH/SUBSCRIBE
    if (is_method("PUBLISH|SUBSCRIBE")) {
        send_reply(503, "Service Unavailable");
        exit;
    }

    # REGISTER handling - ENHANCED NAT SUPPORT
    if (is_method("REGISTER")) {
        route(handle_register);
        exit;
    }

    # Handle incomplete addresses
    if ($rU==NULL) {
        send_reply(484, "Address Incomplete");
        exit;
    }

    # INVITE handling - ENHANCED NAT SUPPORT
    if (is_method("INVITE")) {
        route(handle_invite);
        exit;
    }

    # Handle other requests
    if (lookup("location")) {
        route(relay);
        exit;
    }

    send_reply(404, "User Not Found");
    exit;
}

