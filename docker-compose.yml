services:
  mysql:
    build:
      context: ./etc/mysql/image
    container_name: mysql
    volumes:
      - ./etc/mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_IP=localhost      # ← init scripts connect via socket
    healthcheck:
      test: mysql -u ${MYSQL_USER} -p'${MYSQL_PASSWORD}' opensips -e 'SHOW TABLES LIKE "location"' 2>&1 | grep -q location
      interval: 10s
      timeout: 1s
      retries: 5
      start_period: 20s
    networks:
      local_network:
        ipv4_address: ${MYSQL_IP}

  opensips:
    image: opensips/opensips-all-cp-tools:3.6
    container_name: opensips
    volumes:
      - ./etc/opensips:/etc/opensips
    ports:
      - 5060:5060/udp
      - 5060:5060/tcp
    expose:
      - 9060/tcp
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -p /etc/opensips/substenv.sh
    networks:
      local_network:
        ipv4_address: ${OPENSIPS_IP}

  control-panel:
    build:
      context: ./etc/opensips-cp/image
      dockerfile_inline: FROM opensips/opensips-cp:9.3.6
    container_name: opensips-cp
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 80:80
    expose:
      - 9060/tcp
    volumes:
      - ./etc/opensips-cp/docker-entrypoint.d:/docker-entrypoint.d
    networks:
      local_network:
        ipv4_address: ${CP_IP}

  rtpproxy:
    image: sippylabs/rtpproxy
    container_name: rtpproxy
    env_file:
      - .env
    ports:
      - "${MINPORT}-${MAXPORT}:${MINPORT}-${MAXPORT}/udp"
    networks:
      local_network:
        ipv4_address: ${RTPPROXY_IP}
    command: -s udp:${RTPPROXY_IP}:${RTPPROXY_PORT} -l ${RTPPROXY_IP} -m ${MINPORT} -M ${MAXPORT} -A ${HOST_IP}

  rtpengine:
    image: fonoster/rtpengine:latest
    container_name: rtpengine
    environment:
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_IP}
      RTPENGINE_PORT_MIN: ${MINPORT}
      RTPENGINE_PORT_MAX: ${MAXPORT}
      RTPENGINE_BIND_NG_PORT: ${RTPENGINE_PORT}
      RTPENGINE_BIND_NG_IP: ${RTPENGINE_IP}
      RTPENGINE_LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
    networks:
      local_network:
        ipv4_address: ${RTPENGINE_IP}

volumes:
  mysql_data:

networks:
  local_network:
    ipam:
      config:
        - subnet: ${NETWORK}
